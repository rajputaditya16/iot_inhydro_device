# ==============================================================================
# Enterprise Mosquitto Broker Configuration for 10,000+ Concurrent IoT Devices
# ==============================================================================

# 1. Listeners
listener 1883 0.0.0.0
protocol mqtt

listener 9001 0.0.0.0
protocol websockets

# 2. Concurrency & Connection Scaling
max_connections -1
max_inflight_messages 100
max_queued_messages 50000
max_queued_bytes 0

# 3. Low Latency TCP Optimization
set_tcp_nodelay true

# 4. Persistence & Durability
persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 1800
autosave_on_changes false

# 5. Message Limits (Allow packets up to 10MB for firmware/bulk sync)
message_size_limit 10485760

# 6. Logging
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
log_timestamp true
sys_interval 10
